
{% extends "base.html" %}
{% block title %}Edit Student | EduManage{% endblock %}

{% block content %}
<div class="page-heading">
    <div>
        <h1>Edit Student Details</h1>
        <p>Update the student's academic and contact information.</p>
    </div>
    <a href="{{ url_for('students') }}" class="small-btn">Back to Students</a>
</div>

<div class="content-card">
    <form method="POST" class="form-grid">

        <div>
            <label>Full Name</label>
            <input type="text" name="name" value="{{ student.name }}" required>
        </div>

        <div>
            <label>Email Address</label>
            <input type="email" name="email" value="{{ student.email }}" required>
        </div>

        <div>
            <label>Course</label>
            <input type="text" name="course" value="{{ student.course or '' }}">
        </div>

        <div>
            <label>Academic Year</label>
            <input type="text" name="year" value="{{ student.year or '' }}">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="text" name="phone" value="{{ student.phone or '' }}">
        </div>

        <div class="form-action">
            <button type="submit" class="primary-btn">Save Changes</button>
        </div>

    </form>
</div>
{% endblock %}
